services:
  xxl-job-mysql:
    image: mysql:8.0.32
    container_name: xxl-job-mysql
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${XXL_JOB_MYSQL_ROOT_PASSWORD:?必须配置 XXL_JOB_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: xxl_job
      MYSQL_USER: xxl_job
      MYSQL_PASSWORD: ${XXL_JOB_MYSQL_PASSWORD:?必须配置 XXL_JOB_MYSQL_PASSWORD}
    volumes:
      - xxl-job-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - xxl-job-network

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:3.4.0
    container_name: xxl-job-admin
    restart: unless-stopped
    depends_on:
      xxl-job-mysql:
        condition: service_healthy
    ports:
      - "${XXL_JOB_ADMIN_BIND_IP:-127.0.0.1}:${XXL_JOB_ADMIN_PORT:-8080}:8080"
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: ${XXL_JOB_ADMIN_JAVA_OPTS:--Xms256m -Xmx512m}
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://xxl-job-mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
        --spring.datasource.username=xxl_job
        --spring.datasource.password=${XXL_JOB_MYSQL_PASSWORD:?必须配置 XXL_JOB_MYSQL_PASSWORD}
        --xxl.job.accessToken=${XXL_JOB_ACCESS_TOKEN:?必须配置 XXL_JOB_ACCESS_TOKEN}
        --server.servlet.context-path=/xxl-job-admin
    volumes:
      - xxl-job-admin-logs:/data/applogs
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    networks:
      - xxl-job-network

volumes:
  xxl-job-mysql-data:
  xxl-job-admin-logs:

networks:
  xxl-job-network:
    name: xxl-job-network
    driver: bridge
