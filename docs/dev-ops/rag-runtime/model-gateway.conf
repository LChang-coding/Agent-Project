limit_req_zone $binary_remote_addr zone=embedding_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=reranker_limit:10m rate=3r/s;
limit_req_zone $binary_remote_addr zone=docling_limit:10m rate=5r/s;

server {
    listen 8081;
    server_name _;
    client_max_body_size 4m;

    location = /gateway-health {
        access_log off;
        return 200 "ok\n";
    }

    location = /health { return 404; }
    location = /metrics { return 404; }

    location / {
        if ($embedding_api_authorized = 0) { return 401; }
        limit_req zone=embedding_limit burst=10 nodelay;
        proxy_pass http://embedding:80;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

server {
    listen 8082;
    server_name _;
    client_max_body_size 4m;

    location = /gateway-health {
        access_log off;
        return 200 "ok\n";
    }

    location = /health { return 404; }
    location = /metrics { return 404; }

    location / {
        if ($reranker_api_authorized = 0) { return 401; }
        limit_req zone=reranker_limit burst=6 nodelay;
        proxy_pass http://reranker:80;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}

server {
    listen 5001;
    server_name _;
    client_max_body_size 50m;

    location = /gateway-health {
        access_log off;
        return 200 "ok\n";
    }

    location /v1/ {
        if ($docling_api_authorized = 0) { return 401; }
        limit_req zone=docling_limit burst=10 nodelay;
        proxy_pass http://docling:5001;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location / { return 404; }
}
