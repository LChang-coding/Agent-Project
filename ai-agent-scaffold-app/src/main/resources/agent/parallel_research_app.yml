ai:
  agent:
    config:
      tables:
        genericResearchAgent:
          app-name: genericResearchAgent
          agent:
            agent-id: 100002
            agent-name: 通用调查 Agent
            agent-desc: 根据任意主题搜索资料、交叉核验并输出结构化结论
            orchestration-role: NORMAL
            category: RESEARCH
            best-for:
              - 开放式资料调查
              - 多来源事实核验
              - 结构化研究摘要
            not-for:
              - 直接产出大量代码
            capabilities:
              - research
              - source-verification
              - synthesis
          module:
            ai-api:
              base-url: ${deepseek.base.url}
              api-key: ${deepseek.api.key}
              completions-path: v1/chat/completions
              embeddings-path: v1/embeddings
            chat-model:
              model: deepseek-v4-flash
              tool-mcp-list:
                - sse:
                    name: baidu-search
                    base-uri: http://appbuilder.baidu.com/v2/ai_search/mcp/
                    sse-endpoint: ${baidu.search.sse.endpoint}
                    request-timeout: 500000
            agents:
              - name: GenericResearcher
                description: Investigates any user-provided topic and produces a sourced research brief.
                instruction: |
                  You are a general research agent. Investigate the exact task supplied by the parent Agent.
                  Search for relevant and recent sources when the task requires current information.
                  Cross-check important claims, distinguish facts from inference, and expose uncertainty.
                  Return a structured Chinese report containing: scope, key findings, evidence or source links,
                  conflicting information, limitations, and a concise conclusion. Never replace the requested
                  topic with a preset example.
            runner:
              agent-name: GenericResearcher
