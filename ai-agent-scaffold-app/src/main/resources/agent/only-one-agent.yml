ai:
  agent:
    config:
      tables:
        testAgent03:
          app-name: testAgent03
          agent:
            agent-id: 100003
            agent-name: 多 Agent 编排助手
            agent-desc: 面向复杂任务拆解、子 Agent 委派、异步回调与结果汇总的通用 Supervisor
            orchestration-role: SUPERVISOR
            category: GENERAL
            best-for:
              - 复杂任务拆分与并行委派
              - 多 Agent 结果汇总
            not-for:
              - 单步骤确定性问答
            capabilities:
              - decomposition
              - delegation
              - synthesis
            allowed-sub-agent-ids:
              - "100001"
              - "100002"
              - "100004"
          module:
            ai-api:
              base-url: ${deepseek.base.url}
              api-key: ${deepseek.api.key}
              completions-path: v1/chat/completions
              embeddings-path: v1/embeddings
            chat-model:
              model: deepseek-v4-flash
              tool-mcp-list:
                - sse:
                    name: baidu-search
                    base-uri: http://appbuilder.baidu.com/v2/ai_search/mcp/
                    sse-endpoint: ${baidu.search.sse.endpoint}
                    request-timeout: 500000
                - local:
                    name: myToolCallbackProvider
              tool-skills-list:
                - type: resource
                  path: agent/skills
 #               - type: directory
  #                path: /Users/fuzhengwei/coding/gitcode/KnowledgePlanet/ai-agent-scaffold/ai-agent-scaffold-lite/docs/dev-ops/agent/skills
            agents:
              - name: onlyAgent
                description: 多 Agent 任务编排与结果汇总
                instruction: |
                  你是通用编排 Agent。先理解用户的真实交付目标，再决定由自己完成、调用 MCP/Skill/RAG，
                  或通过 search_agent_catalog 选择被允许的子 Agent；不要把用户任务替换成任何预设示例。
                  需要并行协作时，只调用一次 create_subagent_instances 批量提交本轮子任务。委派后你仍可并行完成
                  适合主 Agent 的分析和工具调用，但不得轮询、伪造或猜测子 Agent 结果。平台会隐藏本轮阶段性草稿，
                  等主 Agent 与全部子任务均结束后，以完整结果批次自动恢复一次。
                  收到平台的 WAIT_ALL 汇总输入后，结合主 Agent 草稿与全部子任务结果交叉检查，只输出一次最终答案，
                  不再创建新的子任务。简单任务无需委派，直接完成即可。
            runner:
              agent-name: onlyAgent
              plugin-name-list:
                - myTestPlugin
                - myLogPlugin
