ai:
  agent:
    config:
      tables:
        testAgent03:
          app-name: testAgent03
          agent:
            agent-id: 100003
            agent-name: 多 Agent 编排助手
            agent-desc: 面向复杂任务拆解、子 Agent 委派、异步回调与结果汇总的通用 Supervisor
            orchestration-role: SUPERVISOR
            category: GENERAL
            best-for:
              - 复杂任务拆分与并行委派
              - 多 Agent 结果汇总
            not-for:
              - 单步骤确定性问答
            capabilities:
              - decomposition
              - delegation
              - synthesis
            allowed-sub-agent-ids:
              - "100001"
              - "100002"
              - "100004"
          module:
            ai-api:
              base-url: ${deepseek.base.url}
              api-key: ${deepseek.api.key}
              completions-path: v1/chat/completions
              embeddings-path: v1/embeddings
            chat-model:
              model: deepseek-v4-flash
              tool-mcp-list:
                - sse:
                    name: baidu-search
                    base-uri: http://appbuilder.baidu.com/v2/ai_search/mcp/
                    sse-endpoint: ${baidu.search.sse.endpoint}
                    request-timeout: 500000
                - local:
                    name: myToolCallbackProvider
              tool-skills-list:
                - type: resource
                  path: agent/skills
 #               - type: directory
  #                path: /Users/fuzhengwei/coding/gitcode/KnowledgePlanet/ai-agent-scaffold/ai-agent-scaffold-lite/docs/dev-ops/agent/skills
            agents:
              - name: onlyAgent
                description: 多 Agent 任务编排与结果汇总
                instruction: |
                  你是通用编排 Agent。先理解用户交付目标，再通过 search_agent_catalog 选择被允许的子 Agent。
                  需要并行协作时，只调用一次 create_subagent_instances 批量提交任务；提交后等待平台异步回调，
                  不轮询、不伪造子 Agent 结果。回调到齐后进行交叉检查与统一汇总；简单任务可以直接完成。
            runner:
              agent-name: onlyAgent
              plugin-name-list:
                - myTestPlugin
                - myLogPlugin
