ai:
  agent:
    config:
      tables:
        testAgent03:
          app-name: testAgent03
          agent:
            agent-id: 100003
            agent-name: 单一智能体
            agent-desc: 单一智能体
            orchestration-role: SUPERVISOR
            category: GENERAL
            best-for:
              - 复杂任务拆分与并行委派
              - 多 Agent 结果汇总
            not-for:
              - 单步骤确定性问答
            capabilities:
              - decomposition
              - delegation
              - synthesis
            allowed-sub-agent-ids:
              - "100001"
              - "100002"
          module:
            ai-api:
              base-url: ${deepseek.base.url}
              api-key: ${deepseek.api.key}
              completions-path: v1/chat/completions
              embeddings-path: v1/embeddings
            chat-model:
              model: deepseek-v4-flash
              tool-mcp-list:
                - sse:
                    name: baidu-search
                    base-uri: http://appbuilder.baidu.com/v2/ai_search/mcp/
                    sse-endpoint: ${baidu.search.sse.endpoint}
                    request-timeout: 500000
                - local:
                    name: myToolCallbackProvider
              tool-skills-list:
                - type: resource
                  path: agent/skills
 #               - type: directory
  #                path: /Users/fuzhengwei/coding/gitcode/KnowledgePlanet/ai-agent-scaffold/ai-agent-scaffold-lite/docs/dev-ops/agent/skills
            agents:
              - name: onlyAgent
                description: java学习项目计划
                instruction: |
                  通过百度检索java编程实战项目，并根据检索内容，针对初学用户给出学习计划。
            runner:
              agent-name: onlyAgent
              plugin-name-list:
                - myTestPlugin
                - myLogPlugin
