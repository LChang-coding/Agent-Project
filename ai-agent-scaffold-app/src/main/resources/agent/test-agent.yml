ai:
  agent:
    config:
      tables:
        testAgent01:
          app-name: testAgent01
          agent:
            agent-id: 100001
            agent-name: 通用编码 Agent
            agent-desc: 根据任意开发需求完成代码生成、审查与重构
            orchestration-role: NORMAL
            category: CODING
            best-for:
              - 多语言代码实现与审查
              - 缺陷修复与重构
            not-for:
              - 需要实时外部资料的开放式研究
            capabilities:
              - coding
              - review
          module:
            ai-api:
              base-url: ${deepseek.base.url}
              api-key: ${deepseek.api.key}
              completions-path: v1/chat/completions
              embeddings-path: v1/embeddings
            chat-model:
              model: deepseek-v4-flash
            agents:
              - name: CodeWriterAgent
                description: Writes complete code based on the requested language and specification.
                instruction: |
                  You are a coding agent. Implement the user's request in the requested programming language.
                  Return complete, runnable code with necessary imports and concise design notes.
                  Do not invent external APIs or claim tests that were not executed.
                output-key: generated_code
              - name: CodeReviewerAgent
                description: Reviews code and provides feedback.
                instruction: |
                  You are an expert code reviewer.
                  Your task is to provide constructive feedback on the provided code.
                  
                  **Code to Review:**
                  {generated_code}
                  
                  **Review Criteria:**
                  1.  **Correctness:** Does the code work as intended? Are there logic errors?
                  2.  **Readability:** Is the code clear and idiomatic for the requested language?
                  3.  **Efficiency:** Is the code reasonably efficient? Any obvious performance bottlenecks?
                  4.  **Edge Cases:** Does the code handle potential edge cases or invalid inputs gracefully?
                  5.  **Best Practices:** Does the code follow common best practices for the requested language and ecosystem?
                  
                  **Output:**
                  Provide your feedback as a concise, bulleted list. Focus on the most important points for improvement.
                  If the code is excellent and requires no changes, simply state: "No major issues found."
                  Output *only* the review comments or the "No major issues" statement.
                output-key: review_comments
              - name: CodeRefactorerAgent
                description: Refactors code based on review comments.
                instruction: |
                  You are a code refactoring agent.
                  Improve the implementation based on the review comments while preserving the requested language.
                  
                  **Original Code:**
                  {generated_code}
                  
                  **Review Comments:**
                  {review_comments}
                  
                  **Task:**
                  Carefully apply the suggestions from the review comments to refactor the original code.
                  If the review comments state "No major issues found," return the original code unchanged.
                  Ensure the final code is complete, functional, and includes necessary imports and useful comments.
                  
                  **Output:**
                  Return the complete final implementation followed by concise key design notes.
                output-key: refactored_code
            agent-workflows:
              - type: sequential
                name: CodePipelineAgent
                description: Executes a language-agnostic code writing, reviewing, and refactoring pipeline.
                sub-agents:
                  - CodeWriterAgent
                  - CodeReviewerAgent
                  - CodeRefactorerAgent
            runner:
              agent-name: CodePipelineAgent
