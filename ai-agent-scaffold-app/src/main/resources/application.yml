spring:
  application:
    name: ai-agent-scaffold-app
  config:
    name: ai-agent-scaffold-app
    import:
      - classpath:secrets.properties
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:69.165.65.123:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      config:
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        group: DEFAULT_GROUP
        file-extension: yml
        refresh-enabled: true
      discovery:
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        service: ${spring.application.name}
        group: DEFAULT_GROUP
    compatibility-verifier:
      enabled: false
  profiles:
    active: dev

xxl:
  job:
    admin:
      addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://127.0.0.1:8080/xxl-job-admin}
    access-token: ${XXL_JOB_ACCESS_TOKEN:}
    executor:
      enabled: ${XXL_JOB_EXECUTOR_ENABLED:false}
      appname: ${XXL_JOB_EXECUTOR_APPNAME:ai-agent-scheduler}
      address: ${XXL_JOB_EXECUTOR_ADDRESS:}
      ip: ${XXL_JOB_EXECUTOR_IP:}
      port: ${XXL_JOB_EXECUTOR_PORT:9999}
      log-path: ${XXL_JOB_EXECUTOR_LOG_PATH:./data/xxl-job}
      log-retention-days: ${XXL_JOB_EXECUTOR_LOG_RETENTION_DAYS:30}

ai:
  rag:
    enabled: ${AI_RAG_ENABLED:false}
    qdrant:
      endpoint: ${AI_RAG_QDRANT_ENDPOINT:http://127.0.0.1:6333}
      api-key: ${AI_RAG_QDRANT_API_KEY:}
      timeout: ${AI_RAG_QDRANT_TIMEOUT:3s}
      max-concurrency: ${AI_RAG_QDRANT_MAX_CONCURRENCY:4}
      batch-size: ${AI_RAG_QDRANT_BATCH_SIZE:64}
      collection: ${AI_RAG_QDRANT_COLLECTION:ai_agent_rag_e5_v1}
      sparse-on-disk: ${AI_RAG_QDRANT_SPARSE_ON_DISK:true}
      max-request-bytes: ${AI_RAG_QDRANT_MAX_REQUEST_BYTES:16777216}
      max-response-bytes: ${AI_RAG_QDRANT_MAX_RESPONSE_BYTES:16777216}
      max-search-top-k: ${AI_RAG_QDRANT_MAX_SEARCH_TOP_K:200}
      prefetch-multiplier: ${AI_RAG_QDRANT_PREFETCH_MULTIPLIER:4}
    embedding:
      endpoint: ${AI_RAG_EMBEDDING_ENDPOINT:http://127.0.0.1:8081}
      api-key: ${AI_RAG_EMBEDDING_API_KEY:}
      timeout: ${AI_RAG_EMBEDDING_TIMEOUT:10s}
      max-concurrency: ${AI_RAG_EMBEDDING_MAX_CONCURRENCY:2}
      batch-size: ${AI_RAG_EMBEDDING_BATCH_SIZE:16}
      dimension: ${AI_RAG_EMBEDDING_DIMENSION:768}
      model-revision: ${AI_RAG_EMBEDDING_MODEL_REVISION:d128750597153bb5987e10b1c3493a34e5a4502a}
    reranker:
      endpoint: ${AI_RAG_RERANKER_ENDPOINT:http://127.0.0.1:8082}
      api-key: ${AI_RAG_RERANKER_API_KEY:}
      timeout: ${AI_RAG_RERANKER_TIMEOUT:10s}
      max-concurrency: ${AI_RAG_RERANKER_MAX_CONCURRENCY:2}
      batch-size: ${AI_RAG_RERANKER_BATCH_SIZE:16}
      request-batch-size: ${AI_RAG_RERANKER_REQUEST_BATCH_SIZE:3}
      model-revision: ${AI_RAG_RERANKER_MODEL_REVISION:2cfc18c9415c912f9d8155881c133215df768a70}
    docling:
      endpoint: ${AI_RAG_DOCLING_ENDPOINT:http://127.0.0.1:5001/v1}
      api-key: ${AI_RAG_DOCLING_API_KEY:}
      timeout: ${AI_RAG_DOCLING_TIMEOUT:120s}
      max-concurrency: ${AI_RAG_DOCLING_MAX_CONCURRENCY:1}
      batch-size: ${AI_RAG_DOCLING_BATCH_SIZE:1}
      parser-revision: ${AI_RAG_DOCLING_PARSER_REVISION:docling-serve-1.26.0}
      max-pages: ${AI_RAG_DOCLING_MAX_PAGES:500}
      max-response-bytes: ${AI_RAG_DOCLING_MAX_RESPONSE_BYTES:67108864}
    kafka:
      topic: ${AI_RAG_KAFKA_TOPIC:rag.ingest.request.v1}
      group-id: ${AI_RAG_KAFKA_GROUP_ID:ai-agent-rag-ingest}
      listener-enabled: ${AI_RAG_KAFKA_LISTENER_ENABLED:false}
    outbox:
      enabled: ${AI_RAG_OUTBOX_ENABLED:false}
      poll-delay-ms: ${AI_RAG_OUTBOX_POLL_DELAY_MS:1000}
      batch-size: ${AI_RAG_OUTBOX_BATCH_SIZE:20}
      lease-duration-ms: ${AI_RAG_OUTBOX_LEASE_DURATION_MS:30000}
      ack-timeout-ms: ${AI_RAG_OUTBOX_ACK_TIMEOUT_MS:10000}
      retry-base-delay-ms: ${AI_RAG_OUTBOX_RETRY_BASE_DELAY_MS:1000}
      retry-max-delay-ms: ${AI_RAG_OUTBOX_RETRY_MAX_DELAY_MS:300000}
      retry-jitter-ratio: ${AI_RAG_OUTBOX_RETRY_JITTER_RATIO:0.2}
    worker:
      enabled: ${AI_RAG_WORKER_ENABLED:false}
      poll-delay-ms: ${AI_RAG_WORKER_POLL_DELAY_MS:2000}
      scan-batch-size: ${AI_RAG_WORKER_SCAN_BATCH_SIZE:10}
      lease-duration-ms: ${AI_RAG_WORKER_LEASE_DURATION_MS:180000}
      heartbeat-interval-ms: ${AI_RAG_WORKER_HEARTBEAT_INTERVAL_MS:30000}
      retry-base-delay-ms: ${AI_RAG_WORKER_RETRY_BASE_DELAY_MS:5000}
      retry-max-delay-ms: ${AI_RAG_WORKER_RETRY_MAX_DELAY_MS:300000}
      child-max-chars: ${AI_RAG_WORKER_CHILD_MAX_CHARS:1800}
      child-max-tokens: ${AI_RAG_WORKER_CHILD_MAX_TOKENS:420}
      parent-max-chars: ${AI_RAG_WORKER_PARENT_MAX_CHARS:6000}
      parent-max-tokens: ${AI_RAG_WORKER_PARENT_MAX_TOKENS:1400}
      overlap-chars: ${AI_RAG_WORKER_OVERLAP_CHARS:160}
    audit:
      store-query-text: ${AI_RAG_AUDIT_STORE_QUERY_TEXT:false}
      store-citation-content: ${AI_RAG_AUDIT_STORE_CITATION_CONTENT:false}
  scheduler:
    reconcile-batch-size: ${AI_SCHEDULER_RECONCILE_BATCH_SIZE:200}
    dispatch-batch-size: ${AI_SCHEDULER_DISPATCH_BATCH_SIZE:50}
    dispatch-concurrency: ${AI_SCHEDULER_DISPATCH_CONCURRENCY:2}
    lease-seconds: ${AI_SCHEDULER_LEASE_SECONDS:120}
    heartbeat-seconds: ${AI_SCHEDULER_HEARTBEAT_SECONDS:30}
    retry-base-seconds: ${AI_SCHEDULER_RETRY_BASE_SECONDS:30}
    local-fallback-enabled: ${AI_SCHEDULER_LOCAL_FALLBACK_ENABLED:false}
    local-reconcile-delay-ms: ${AI_SCHEDULER_LOCAL_RECONCILE_DELAY_MS:300000}
    local-dispatch-delay-ms: ${AI_SCHEDULER_LOCAL_DISPATCH_DELAY_MS:5000}
