server:
  port: 8091

# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

# 数据库配置；启动时配置数据库资源信息
spring:
  config:
    import:
            - optional:nacos:ai-agent-scaffold-app-dev.yml?group=DEFAULT_GROUP&refreshEnabled=true
    #        - classpath:agent/test-agent-02.yml
       #     - classpath:agent/test-agent.yml
            - classpath:agent/only-one-agent.yml
        #    - classpath:agent/parallel_research_app.yml
  datasource:
    username: ${MYSQL_USERNAME:ai_agent_app}
    password: ${MYSQL_PASSWORD:}
    url: jdbc:mysql://${MYSQL_HOST:69.165.65.123}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ai_agent_scaffold}?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
  hikari:
    pool-name: Retail_HikariCP
    minimum-idle: 15 #最小空闲连接数量
    idle-timeout: 180000 #空闲连接存活最大时间，默认600000（10分钟）
    maximum-pool-size: 25 #连接池最大连接数，默认是10
    auto-commit: true  #此属性控制从池返回的连接的默认自动提交行为,默认值：true
    max-lifetime: 1800000 #此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认1800000即30分钟
    connection-timeout: 30000 #数据库连接超时时间,默认30秒，即30000
    connection-test-query: SELECT 1
  type: com.zaxxer.hikari.HikariDataSource
  data:
    redis:
      host: ${REDIS_HOST:69.165.65.123}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:3s}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
    admin:
      auto-create: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        isolation.level: read_committed
    listener:
      ack-mode: record
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-512}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}
      ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
      ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
      ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:PKCS12}

# MyBatis 配置
mybatis:
  mapper-locations: classpath*:/mybatis/mapper/*.xml
  config-location: classpath:/mybatis/config/mybatis-config.xml

# 日志
logging:
  path: ${OBS_LOG_DIR:./data/log}
  level:
    root: info
  config: classpath:logback-spring.xml

security:
  jwt:
    issuer: ai-agent-scaffold
    secret: ${JWT_SECRET:dev-only-change-me-ai-agent-scaffold}
    expire-seconds: 7200
    refresh-expire-seconds: 2592000

ai:
  context:
    enabled: ${AI_CONTEXT_ENABLED:false}
    policy-version: v1
    model-window-tokens: ${AI_CONTEXT_MODEL_WINDOW_TOKENS:0}
    reserve-output-tokens: ${AI_CONTEXT_RESERVE_OUTPUT_TOKENS:8192}
    safety-margin-tokens: ${AI_CONTEXT_SAFETY_MARGIN_TOKENS:2048}
    long-term-memory-tokens: ${AI_CONTEXT_LONG_TERM_MEMORY_TOKENS:2048}
    recent-conversation-tokens: ${AI_CONTEXT_RECENT_CONVERSATION_TOKENS:8192}
    recent-window-max-messages: ${AI_CONTEXT_RECENT_WINDOW_MAX_MESSAGES:100}
    upstream-tokens: ${AI_CONTEXT_UPSTREAM_TOKENS:4096}
    rag-tokens: ${AI_CONTEXT_RAG_TOKENS:0}
    compaction-min-uncovered-tokens: ${AI_CONTEXT_COMPACTION_MIN_UNCOVERED_TOKENS:12000}
    compaction-retain-recent-tokens: ${AI_CONTEXT_COMPACTION_RETAIN_RECENT_TOKENS:4096}
    compaction-max-attempts: ${AI_CONTEXT_COMPACTION_MAX_ATTEMPTS:3}
    cache-ttl-seconds: ${AI_CONTEXT_CACHE_TTL_SECONDS:1800}
    kafka:
      enabled: ${AI_CONTEXT_KAFKA_ENABLED:false}
      topic: ${AI_CONTEXT_KAFKA_TOPIC:context.compaction.request.v1}
      group-id: ${AI_CONTEXT_KAFKA_GROUP_ID:ai-agent-context-compaction}
      retry-attempts: ${AI_CONTEXT_KAFKA_RETRY_ATTEMPTS:3}
      retry-delay-ms: ${AI_CONTEXT_KAFKA_RETRY_DELAY_MS:1000}
  observability:
    sample:
      enabled: true
  storage:
    type: ${OBJECT_STORAGE_TYPE:local}
    local-root: ${OBJECT_STORAGE_LOCAL_ROOT:./data/object-storage}
    minio:
      endpoint: ${MINIO_ENDPOINT:http://69.165.65.123:9000}
      access-key: ${MINIO_ACCESS_KEY:}
      secret-key: ${MINIO_SECRET_KEY:}
      skill-bucket: ${MINIO_SKILL_BUCKET:ai-agent-skills}
      asset-bucket: ${MINIO_ASSET_BUCKET:ai-agent-assets}
