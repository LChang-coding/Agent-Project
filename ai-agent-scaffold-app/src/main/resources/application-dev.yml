server:
  port: 8091

# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: ${APP_EXECUTOR_CORE_POOL_SIZE:4}
        max-pool-size: ${APP_EXECUTOR_MAX_POOL_SIZE:8}
        keep-alive-time: ${APP_EXECUTOR_KEEP_ALIVE_SECONDS:60}
        block-queue-size: ${APP_EXECUTOR_QUEUE_SIZE:256}
        allow-core-thread-timeout: ${APP_EXECUTOR_ALLOW_CORE_TIMEOUT:true}
        policy: ${APP_EXECUTOR_REJECTION_POLICY:CallerRunsPolicy}

workflow:
  executor:
    coordinator:
      core-pool-size: ${WORKFLOW_COORDINATOR_CORE_POOL_SIZE:1}
      max-pool-size: ${WORKFLOW_COORDINATOR_MAX_POOL_SIZE:2}
      queue-capacity: ${WORKFLOW_COORDINATOR_QUEUE_CAPACITY:8}
      keep-alive-seconds: ${WORKFLOW_COORDINATOR_KEEP_ALIVE_SECONDS:30}
      allow-core-thread-timeout: ${WORKFLOW_COORDINATOR_ALLOW_CORE_TIMEOUT:true}
    node:
      core-pool-size: ${WORKFLOW_NODE_CORE_POOL_SIZE:2}
      max-pool-size: ${WORKFLOW_NODE_MAX_POOL_SIZE:4}
      queue-capacity: ${WORKFLOW_NODE_QUEUE_CAPACITY:0}
      keep-alive-seconds: ${WORKFLOW_NODE_KEEP_ALIVE_SECONDS:30}
      allow-core-thread-timeout: ${WORKFLOW_NODE_ALLOW_CORE_TIMEOUT:true}

# 数据库配置；启动时配置数据库资源信息
spring:
  servlet:
    multipart:
      file-size-threshold: 0
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:50MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:52MB}
  config:
    import:
            - optional:nacos:ai-agent-scaffold-app-dev.yml?group=DEFAULT_GROUP&refreshEnabled=true
    #        - classpath:agent/test-agent-02.yml
       #     - classpath:agent/test-agent.yml
            - classpath:agent/only-one-agent.yml
        #    - classpath:agent/parallel_research_app.yml
  datasource:
    username: ${MYSQL_USERNAME:ai_agent_app}
    password: ${MYSQL_PASSWORD:}
    url: jdbc:mysql://${MYSQL_HOST:103.205.240.84}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ai_agent_scaffold}?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=UTC&sslMode=REQUIRED&allowPublicKeyRetrieval=false&connectTimeout=5000&socketTimeout=15000&tcpKeepAlive=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: AiAgentHikariPool
      minimum-idle: ${MYSQL_POOL_MIN_IDLE:2}
      maximum-pool-size: ${MYSQL_POOL_MAX_SIZE:10}
      idle-timeout: ${MYSQL_POOL_IDLE_TIMEOUT_MS:300000}
      max-lifetime: ${MYSQL_POOL_MAX_LIFETIME_MS:1200000}
      keepalive-time: ${MYSQL_POOL_KEEPALIVE_MS:300000}
      connection-timeout: ${MYSQL_POOL_CONNECTION_TIMEOUT_MS:10000}
      validation-timeout: ${MYSQL_POOL_VALIDATION_TIMEOUT_MS:3000}
      auto-commit: true
  data:
    redis:
      host: ${REDIS_HOST:69.165.65.123}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:3s}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
    admin:
      auto-create: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        isolation.level: read_committed
    listener:
      ack-mode: record
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-512}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}
      ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
      ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
      ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:PKCS12}

# MyBatis 配置
mybatis:
  mapper-locations: classpath*:/mybatis/mapper/*.xml
  config-location: classpath:/mybatis/config/mybatis-config.xml

# 日志
logging:
  path: ${OBS_LOG_DIR:./data/log}
  level:
    root: info
  config: classpath:logback-spring.xml

security:
  jwt:
    issuer: ai-agent-scaffold
    secret: ${JWT_SECRET:dev-only-change-me-ai-agent-scaffold}
    expire-seconds: 7200
    refresh-expire-seconds: 2592000

ai:
  rag:
    enabled: ${AI_RAG_ENABLED:true}
    qdrant:
      endpoint: ${AI_RAG_QDRANT_ENDPOINT:http://103.205.240.84:6333}
    embedding:
      endpoint: ${AI_RAG_EMBEDDING_ENDPOINT:http://103.205.240.84:8081}
      request-timeout: ${AI_RAG_EMBEDDING_REQUEST_TIMEOUT:20s}
      timeout: ${AI_RAG_EMBEDDING_TIMEOUT:60s}
    reranker:
      endpoint: ${AI_RAG_RERANKER_ENDPOINT:http://103.205.240.84:8082}
      request-timeout: ${AI_RAG_RERANKER_REQUEST_TIMEOUT:20s}
      timeout: ${AI_RAG_RERANKER_TIMEOUT:60s}
    docling:
      endpoint: ${AI_RAG_DOCLING_ENDPOINT:http://103.205.240.84:5001/v1}
    kafka:
      listener-enabled: ${AI_RAG_KAFKA_LISTENER_ENABLED:true}
    outbox:
      enabled: ${AI_RAG_OUTBOX_ENABLED:true}
    worker:
      enabled: ${AI_RAG_WORKER_ENABLED:true}
  context:
    enabled: ${AI_CONTEXT_ENABLED:true}
    policy-version: v1
    model-window-tokens: ${AI_CONTEXT_MODEL_WINDOW_TOKENS:128000}
    reserve-output-tokens: ${AI_CONTEXT_RESERVE_OUTPUT_TOKENS:8192}
    safety-margin-tokens: ${AI_CONTEXT_SAFETY_MARGIN_TOKENS:2048}
    long-term-memory-tokens: ${AI_CONTEXT_LONG_TERM_MEMORY_TOKENS:2048}
    recent-conversation-tokens: ${AI_CONTEXT_RECENT_CONVERSATION_TOKENS:8192}
    recent-window-max-messages: ${AI_CONTEXT_RECENT_WINDOW_MAX_MESSAGES:100}
    upstream-tokens: ${AI_CONTEXT_UPSTREAM_TOKENS:4096}
    attachment-candidate-limit: ${AI_CONTEXT_ATTACHMENT_CANDIDATE_LIMIT:32}
    attachment-max-content-chars: ${AI_CONTEXT_ATTACHMENT_MAX_CONTENT_CHARS:131072}
    rag-tokens: ${AI_CONTEXT_RAG_TOKENS:4096}
    compaction-min-uncovered-tokens: ${AI_CONTEXT_COMPACTION_MIN_UNCOVERED_TOKENS:12000}
    compaction-retain-recent-tokens: ${AI_CONTEXT_COMPACTION_RETAIN_RECENT_TOKENS:4096}
    compaction-max-attempts: ${AI_CONTEXT_COMPACTION_MAX_ATTEMPTS:3}
    cache-ttl-seconds: ${AI_CONTEXT_CACHE_TTL_SECONDS:1800}
    kafka:
      enabled: ${AI_CONTEXT_KAFKA_ENABLED:false}
      topic: ${AI_CONTEXT_KAFKA_TOPIC:context.compaction.request.v1}
      group-id: ${AI_CONTEXT_KAFKA_GROUP_ID:ai-agent-context-compaction}
      retry-attempts: ${AI_CONTEXT_KAFKA_RETRY_ATTEMPTS:3}
      retry-delay-ms: ${AI_CONTEXT_KAFKA_RETRY_DELAY_MS:1000}
  skill-package:
    max-entries: ${AI_SKILL_PACKAGE_MAX_ENTRIES:256}
    max-entry-bytes: ${AI_SKILL_PACKAGE_MAX_ENTRY_BYTES:1048576}
  observability:
    sample:
      enabled: ${AI_OBSERVABILITY_SAMPLE_ENABLED:false}
  storage:
    type: ${OBJECT_STORAGE_TYPE:local}
    local-root: ${OBJECT_STORAGE_LOCAL_ROOT:./data/object-storage}
    minio:
      endpoint: ${MINIO_ENDPOINT:http://69.165.65.123:9000}
      access-key: ${MINIO_ACCESS_KEY:}
      secret-key: ${MINIO_SECRET_KEY:}
      skill-bucket: ${MINIO_SKILL_BUCKET:ai-agent-skills}
      asset-bucket: ${MINIO_ASSET_BUCKET:ai-agent-assets}
      rag-bucket: ${MINIO_RAG_BUCKET:ai-agent-rag}
